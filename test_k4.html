<!DOCTYPE html>
<html>
<head>
  <title>K4 Tutte Embedding Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    .pass { color: #4ec9b0; }
    .fail { color: #f44747; }
    .info { color: #9cdcfe; }
    svg { border: 1px solid #555; margin: 10px; }
    h2 { color: #dcdcaa; }
    pre { background: #2d2d2d; padding: 10px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>K4 Tutte Embedding Test</h1>
  <p>Tests the specific bug: triangle + center vertex (K4) must get a valid planar embedding.</p>

  <div id="results"></div>
  <div id="drawings"></div>

  <script type="module">
    import { isPlanarAndEmbed, validateEmbedding } from './js/planarity.js';
    import { tutteEmbedding, extractFaces, findLargestFace, scaleToBox } from './js/tutte.js';

    const out = document.getElementById('results');
    const drawings = document.getElementById('drawings');

    function log(msg, cls = 'info') {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = msg;
      out.appendChild(div);
    }

    function logPre(msg) {
      const pre = document.createElement('pre');
      pre.textContent = msg;
      out.appendChild(pre);
    }

    function drawGraph(positions, edges, title) {
      const W = 200, H = 200;
      const ns = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      ns.setAttribute('width', W);
      ns.setAttribute('height', H);
      ns.setAttribute('viewBox', `0 0 ${W} ${H}`);
      
      const titleEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      titleEl.setAttribute('x', W/2);
      titleEl.setAttribute('y', 15);
      titleEl.setAttribute('text-anchor', 'middle');
      titleEl.setAttribute('fill', '#dcdcaa');
      titleEl.setAttribute('font-size', '12');
      titleEl.textContent = title;
      ns.appendChild(titleEl);

      for (const [u, v] of edges) {
        const pu = positions.get(u), pv = positions.get(v);
        if (!pu || !pv) continue;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', pu.x); line.setAttribute('y1', pu.y);
        line.setAttribute('x2', pv.x); line.setAttribute('y2', pv.y);
        line.setAttribute('stroke', '#888'); line.setAttribute('stroke-width', '1.5');
        ns.appendChild(line);
      }

      for (const [v, {x, y}] of positions) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 6);
        c.setAttribute('fill', '#3498db');
        ns.appendChild(c);
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', x); t.setAttribute('y', y - 10);
        t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', '#d4d4d4');
        t.setAttribute('font-size', '11');
        t.textContent = v;
        ns.appendChild(t);
      }

      drawings.appendChild(ns);
    }

    // ── Test graphs ────────────────────────────────────────────

    const tests = [
      {
        name: 'K4 (vertices 0-3)',
        graph: new Map([
          [0, [1, 2, 3]],
          [1, [0, 2, 3]],
          [2, [0, 1, 3]],
          [3, [0, 1, 2]],
        ]),
        edges: [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]],
      },
      {
        name: 'K4 (vertices 5,7,9,11)',
        graph: new Map([
          [5, [7, 9, 11]],
          [7, [5, 9, 11]],
          [9, [5, 7, 11]],
          [11, [5, 7, 9]],
        ]),
        edges: [[5,7],[5,9],[5,11],[7,9],[7,11],[9,11]],
      },
      {
        name: 'Triangle (K3)',
        graph: new Map([
          [1, [2, 3]],
          [2, [1, 3]],
          [3, [1, 2]],
        ]),
        edges: [[1,2],[1,3],[2,3]],
      },
      {
        name: 'K4 + one vertex (wheel W4)',
        graph: new Map([
          [0, [1, 2, 3, 4]],
          [1, [0, 2, 4]],
          [2, [0, 1, 3]],
          [3, [0, 2, 4]],
          [4, [0, 1, 3]],
        ]),
        edges: [[0,1],[0,2],[0,3],[0,4],[1,2],[2,3],[3,4],[1,4]],
      },
    ];

    log('═══════════════════════════════════════════════');
    log('  Running K4 / small-graph Tutte pipeline tests');
    log('═══════════════════════════════════════════════');

    let allPassed = true;

    for (const t of tests) {
      log('');
      log(`── ${t.name} (V=${t.graph.size}, E=${t.edges.length}) ──`, 'info');

      // Step 1: planarity + embedding
      const { planar, embedding } = isPlanarAndEmbed(t.graph);
      log(`  Planar: ${planar}`, planar ? 'pass' : 'fail');

      if (!planar || !embedding) {
        log('  FAIL: expected planar!', 'fail');
        allPassed = false;
        continue;
      }

      // Validate embedding
      const v = validateEmbedding(t.graph, embedding);
      log(`  Embedding valid: ${v.valid}`, v.valid ? 'pass' : 'fail');
      if (!v.valid) {
        v.errors.forEach(e => log(`    • ${e}`, 'fail'));
        allPassed = false;
      }

      logPre('  Rotation system:\n' + 
        [...embedding].map(([v, rot]) => `    ${v} → [${rot.join(', ')}]`).join('\n'));

      // Step 2: extract faces
      const faces = extractFaces(embedding);
      log(`  Faces (${faces.length}):`, 'info');
      faces.forEach((f, i) => log(`    F${i}: [${f.join(', ')}] (size ${f.length})`));

      const V = t.graph.size, E = t.edges.length, F = faces.length;
      const euler = V - E + F;
      log(`  Euler: V(${V}) - E(${E}) + F(${F}) = ${euler}  ${euler === 2 ? '✓' : '✗ expected 2'}`,
          euler === 2 ? 'pass' : 'fail');
      if (euler !== 2) allPassed = false;

      // Check all faces are proper (no repeated vertices for simple planar graphs)
      for (const f of faces) {
        if (new Set(f).size !== f.length) {
          log(`    ⚠ Face [${f.join(',')}] has repeated vertices!`, 'fail');
          allPassed = false;
        }
      }

      // Step 3: outer face
      const outerFace = findLargestFace(faces);
      log(`  Outer face: [${outerFace.join(', ')}]`);

      // Step 4: Tutte embedding
      try {
        const tuttePos = tutteEmbedding(t.graph, outerFace);
        const scaled = scaleToBox(tuttePos, 200, 200, 25);

        let hasNaN = false;
        for (const [v, {x, y}] of scaled) {
          if (isNaN(x) || isNaN(y)) { hasNaN = true; break; }
        }
        log(`  Tutte: ${hasNaN ? 'FAIL (NaN)' : 'OK'}`, hasNaN ? 'fail' : 'pass');
        if (hasNaN) allPassed = false;

        // Check no coincident points
        const pts = [...scaled.entries()];
        for (let i = 0; i < pts.length; i++) {
          for (let j = i + 1; j < pts.length; j++) {
            const d = Math.hypot(pts[i][1].x - pts[j][1].x, pts[i][1].y - pts[j][1].y);
            if (d < 1) {
              log(`  ⚠ Vertices ${pts[i][0]} and ${pts[j][0]} are too close (${d.toFixed(2)}px)`, 'fail');
              allPassed = false;
            }
          }
        }

        drawGraph(scaled, t.edges, t.name);
      } catch (e) {
        log(`  Tutte FAILED: ${e.message}`, 'fail');
        allPassed = false;
      }
    }

    log('');
    log('═══════════════════════════════════════════════');
    log(allPassed ? '  ALL TESTS PASSED ✓' : '  SOME TESTS FAILED ✗', allPassed ? 'pass' : 'fail');
    log('═══════════════════════════════════════════════');
  </script>
</body>
</html>
